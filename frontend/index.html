<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售 Agent 调试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus,
        .input-group textarea:focus {
            border-color: #667eea;
            outline: none;
        }
        
        .input-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result-section {
            margin-top: 30px;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .result-header h2 {
            color: #333;
            font-size: 24px;
        }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .status-success {
            background: #4caf50;
            color: white;
        }
        
        .status-partial {
            background: #ff9800;
            color: white;
        }
        
        .status-error {
            background: #f44336;
            color: white;
        }
        
        .result-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            background: #f0f0f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .result-content {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            min-height: 200px;
        }
        
        .result-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
        }
        
        .result-card h3 {
            color: #333;
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .result-card .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .result-card .data-label {
            color: #666;
            font-weight: 500;
        }
        
        .result-card .data-value {
            color: #333;
            font-weight: 600;
        }
        
        .json-viewer {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        
        .task-log {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
        }
        
        .task-log-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .task-log-status {
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .task-completed {
            background: #4caf50;
            color: white;
        }
        
        .task-failed {
            background: #f44336;
            color: white;
        }
        
        .task-running {
            background: #2196f3;
            color: white;
        }
        
        .examples {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
        }
        
        .examples h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .example-item {
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid #e0e0e0;
            transition: all 0.3s;
        }
        
        .example-item:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }
        
        .hidden {
            display: none;
        }
        
        /* 数据库查询面板样式 */
        .db-query-section {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            border: 2px solid #667eea;
        }
        
        .db-query-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        .db-query-section .input-group {
            margin-bottom: 15px;
        }
        
        .db-query-section .query-tips {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .db-query-section .query-tips span {
            display: inline-block;
            background: #e0e0e0;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 5px;
            cursor: pointer;
        }
        
        .db-query-section .query-tips span:hover {
            background: #667eea;
            color: white;
        }
        
        .db-result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .db-result-table th,
        .db-result-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .db-result-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }
        
        .db-result-table tr:hover {
            background: #f5f5f5;
        }
        
        .db-result-table tr:last-child td {
            border-bottom: none;
        }
        
        .db-inventory-card {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .db-inventory-item {
            background: white;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #e0e0e0;
        }
        
        .db-inventory-item h4 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .db-inventory-item .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
        }
        
        .db-inventory-item .data-label {
            color: #666;
        }
        
        .db-inventory-item .data-value {
            color: #333;
            font-weight: 500;
        }
        
        .db-loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }
        
        .db-empty {
            text-align: center;
            padding: 30px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>可编排多工具销售任务拆解 Agent</h1>
            <p>智能拆解销售全流程子任务，调度多数据源工具，生成定制销售方案</p>
        </div>
        
        <div class="input-section">
            <div class="input-group">
                <label for="customerId">客户 ID（可选）</label>
                <input type="text" id="customerId" placeholder="例如: C001">
            </div>
            
            <div class="input-group">
                <label for="productCategory">产品品类（可选）</label>
                <input type="text" id="productCategory" placeholder="例如: 工业风机">
            </div>
            
            <div class="input-group">
                <label for="query">客户咨询内容</label>
                <textarea id="query" placeholder="例如: 采购50台工业风机，想要30天账期，对比往期大客户成交价，给一套合作方案"></textarea>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="submitQuery()">生成销售方案</button>
                <button class="btn btn-secondary" onclick="clearForm()">清空</button>
                <button class="btn btn-secondary" onclick="initDatabase()">初始化数据库</button>
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在生成销售方案...</p>
        </div>
        
        <div class="result-section hidden" id="resultSection">
            <div class="result-header">
                <h2>销售方案结果</h2>
                <span class="status-badge" id="statusBadge"></span>
            </div>
            
            <div class="result-tabs">
                <div class="tab active" onclick="switchTab('summary')">方案摘要</div>
                <div class="tab" onclick="switchTab('inventory')">库存信息</div>
                <div class="tab" onclick="switchTab('pricing')">价格信息</div>
                <div class="tab" onclick="switchTab('cases')">相似案例</div>
                <div class="tab" onclick="switchTab('reflection')">反思验真</div>
                <div class="tab" onclick="switchTab('logs')">任务日志</div>
                <div class="tab" onclick="switchTab('json')">完整 JSON</div>
            </div>
            
            <div class="result-content" id="resultContent"></div>
        </div>
        
        <!-- 数据库查询面板 -->
        <div class="db-query-section" id="dbQuerySection">
            <h3>数据库查询（只读）</h3>
            <p style="color: #666; margin-bottom: 15px; font-size: 14px;">
                支持查询库存、产品、价格、客户、成交记录，输入描述文本即可智能匹配
            </p>
            
            <div class="input-group">
                <label for="dbQuery">查询内容</label>
                <input type="text" id="dbQuery" placeholder="例如: 查一下工业风机的库存 / 查看所有产品 / 客户列表">
            </div>
            
            <div class="query-tips">
                <span onclick="quickQuery('库存查询')">查库存</span>
                <span onclick="quickQuery('查看所有产品')">产品列表</span>
                <span onclick="quickQuery('查看价格')">查价格</span>
                <span onclick="quickQuery('客户列表')">查客户</span>
                <span onclick="quickQuery('最近成交记录')">成交记录</span>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="executeDbQuery()">查询</button>
                <button class="btn btn-secondary" onclick="clearDbQuery()">清空</button>
                <button class="btn btn-secondary" onclick="loadProductList()">加载产品列表</button>
                <button class="btn btn-secondary" onclick="loadInventoryOverview()">加载库存概览</button>
            </div>
            
            <div id="dbQueryResult"></div>
        </div>
        
        <div class="examples">
            <h3>示例查询</h3>
            <div class="example-item" onclick="useExample(1)">
                采购50台工业风机，想要30天账期，对比往期大客户成交价，给一套合作方案
            </div>
            <div class="example-item" onclick="useExample(2)">
                采购100台电机，预算控制在12万以内，需要快速交货
            </div>
            <div class="example-item" onclick="useExample(3)">
                采购20台离心泵，用于化工流程改造，需要技术方案和报价
            </div>
        </div>
    </div>
    
    <script>
        let currentResult = null;
        
        async function submitQuery() {
            const customerId = document.getElementById('customerId').value;
            const productCategory = document.getElementById('productCategory').value;
            const query = document.getElementById('query').value;
            
            if (!query) {
                alert('请输入客户咨询内容');
                return;
            }
            
            // 显示加载状态
            document.getElementById('loading').classList.add('active');
            document.getElementById('resultSection').classList.add('hidden');
            
            try {
                const response = await fetch('/api/chat/sales', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        customer_id: customerId || null,
                        product_category: productCategory || null,
                        query: query
                    })
                });
                
                const result = await response.json();
                currentResult = result;
                
                // 显示结果
                displayResult(result);
                
            } catch (error) {
                alert('请求失败: ' + error.message);
            } finally {
                document.getElementById('loading').classList.remove('active');
            }
        }
        
        function displayResult(result) {
            document.getElementById('resultSection').classList.remove('hidden');
            
            // 更新状态徽章
            const statusBadge = document.getElementById('statusBadge');
            statusBadge.textContent = result.status === 'success' ? '成功' : 
                                      result.status === 'partial' ? '部分成功' : '失败';
            statusBadge.className = 'status-badge status-' + result.status;
            
            // 默认显示摘要
            switchTab('summary');
        }
        
        function switchTab(tabName) {
            // 更新标签样式
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                if (tab.textContent.includes(getTabTitle(tabName))) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
            
            // 更新内容
            const content = document.getElementById('resultContent');
            
            switch (tabName) {
                case 'summary':
                    content.innerHTML = renderSummary();
                    break;
                case 'inventory':
                    content.innerHTML = renderInventory();
                    break;
                case 'pricing':
                    content.innerHTML = renderPricing();
                    break;
                case 'cases':
                    content.innerHTML = renderCases();
                    break;
                case 'reflection':
                    content.innerHTML = renderReflection();
                    break;
                case 'logs':
                    content.innerHTML = renderLogs();
                    break;
                case 'json':
                    content.innerHTML = renderJson();
                    break;
            }
        }
        
        function getTabTitle(tabName) {
            const titles = {
                'summary': '方案摘要',
                'inventory': '库存信息',
                'pricing': '价格信息',
                'cases': '相似案例',
                'reflection': '反思验真',
                'logs': '任务日志',
                'json': '完整 JSON'
            };
            return titles[tabName] || '';
        }
        
        function renderSummary() {
            if (!currentResult || !currentResult.proposal) {
                return '<p>暂无方案数据</p>';
            }
            
            const proposal = currentResult.proposal;
            return `
                <div class="result-card">
                    <h3>方案摘要</h3>
                    <p>${proposal.summary}</p>
                </div>
                <div class="result-card">
                    <h3>定价策略</h3>
                    <p>${proposal.pricing_strategy}</p>
                </div>
                <div class="result-card">
                    <h3>库存保障</h3>
                    <p>${proposal.inventory_assurance}</p>
                </div>
                <div class="result-card">
                    <h3>付款建议</h3>
                    <p>${proposal.payment_recommendation}</p>
                </div>
                <div class="result-card">
                    <h3>竞争优势</h3>
                    <p>${proposal.competitive_advantage}</p>
                </div>
                <div class="result-card">
                    <h3>后续行动</h3>
                    <ul>${proposal.next_steps.map(step => `<li>${step}</li>`).join('')}</ul>
                </div>
                ${proposal.risk_warnings.length > 0 ? `
                <div class="result-card">
                    <h3>风险提示</h3>
                    <ul>${proposal.risk_warnings.map(warning => `<li>${warning}</li>`).join('')}</ul>
                </div>
                ` : ''}
            `;
        }
        
        function renderInventory() {
            if (!currentResult || !currentResult.inventory) {
                return '<p>暂无库存数据</p>';
            }
            
            const inventory = currentResult.inventory;
            return `
                <div class="result-card">
                    <h3>库存信息</h3>
                    <div class="data-row">
                        <span class="data-label">产品名称</span>
                        <span class="data-value">${inventory.product_name}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">产品SKU</span>
                        <span class="data-value">${inventory.product_sku || '未知'}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">库存总量</span>
                        <span class="data-value">${inventory.stock_quantity}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">可用库存</span>
                        <span class="data-value">${inventory.available_quantity}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">备货周期</span>
                        <span class="data-value">${inventory.lead_time}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">仓库位置</span>
                        <span class="data-value">${inventory.warehouse_location || '未知'}</span>
                    </div>
                </div>
            `;
        }
        
        function renderPricing() {
            if (!currentResult || !currentResult.pricing) {
                return '<p>暂无价格数据</p>';
            }
            
            const pricing = currentResult.pricing;
            return `
                <div class="result-card">
                    <h3>价格信息</h3>
                    <div class="data-row">
                        <span class="data-label">单价</span>
                        <span class="data-value">${pricing.unit_price.toFixed(2)} ${pricing.currency}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">总价</span>
                        <span class="data-value">${pricing.total_price.toFixed(2)} ${pricing.currency}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">折扣率</span>
                        <span class="data-value">${(pricing.discount_rate * 100).toFixed(1)}%</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">付款条件</span>
                        <span class="data-value">${pricing.payment_terms}</span>
                    </div>
                    ${pricing.discount_reason ? `
                    <div class="data-row">
                        <span class="data-label">折扣原因</span>
                        <span class="data-value">${pricing.discount_reason}</span>
                    </div>
                    ` : ''}
                </div>
            `;
        }
        
        function renderCases() {
            if (!currentResult || !currentResult.cases || currentResult.cases.length === 0) {
                return '<p>暂无案例数据</p>';
            }
            
            return currentResult.cases.map(caseItem => `
                <div class="result-card">
                    <h3>案例 ${caseItem.case_id}</h3>
                    <div class="data-row">
                        <span class="data-label">客户名称</span>
                        <span class="data-value">${caseItem.customer_name || '未知'}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">行业</span>
                        <span class="data-value">${caseItem.industry || '未知'}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">采购数量</span>
                        <span class="data-value">${caseItem.quantity}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">成交单价</span>
                        <span class="data-value">${caseItem.deal_price.toFixed(2)} CNY</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">付款条件</span>
                        <span class="data-value">${caseItem.payment_terms}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">成交日期</span>
                        <span class="data-value">${caseItem.deal_date || '未知'}</span>
                    </div>
                    ${caseItem.similarity_score ? `
                    <div class="data-row">
                        <span class="data-label">相似度</span>
                        <span class="data-value">${(caseItem.similarity_score * 100).toFixed(1)}%</span>
                    </div>
                    ` : ''}
                </div>
            `).join('');
        }
        
        function renderReflection() {
            if (!currentResult || !currentResult.reflection_report) {
                return '<p>反思验真未启用</p>';
            }
            
            const reflection = currentResult.reflection_report;
            return `
                <div class="result-card">
                    <h3>反思验真报告</h3>
                    <div class="data-row">
                        <span class="data-label">启用状态</span>
                        <span class="data-value">${reflection.enabled ? '已启用' : '未启用'}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">整体置信度</span>
                        <span class="data-value">${(reflection.overall_confidence * 100).toFixed(1)}%</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">已验证字段</span>
                        <span class="data-value">${reflection.verified_fields.join(', ') || '无'}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">未验证字段</span>
                        <span class="data-value">${reflection.unverified_fields.join(', ') || '无'}</span>
                    </div>
                </div>
                ${reflection.warnings.length > 0 ? `
                <div class="result-card">
                    <h3>警告信息</h3>
                    <ul>${reflection.warnings.map(w => `<li>${w}</li>`).join('')}</ul>
                </div>
                ` : ''}
                ${reflection.hallucinations_detected.length > 0 ? `
                <div class="result-card">
                    <h3>检测到的幻觉</h3>
                    <ul>${reflection.hallucinations_detected.map(h => `<li>${h}</li>`).join('')}</ul>
                </div>
                ` : ''}
            `;
        }
        
        function renderLogs() {
            if (!currentResult || !currentResult.task_logs || currentResult.task_logs.length === 0) {
                return '<p>暂无任务日志</p>';
            }
            
            return currentResult.task_logs.map(log => `
                <div class="task-log">
                    <div class="task-log-header">
                        <span><strong>${log.task_type}</strong> - ${log.tool_name}</span>
                        <span class="task-log-status task-${log.status}">${log.status}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">任务ID</span>
                        <span class="data-value">${log.task_id}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">耗时</span>
                        <span class="data-value">${log.duration_ms ? log.duration_ms + 'ms' : '未知'}</span>
                    </div>
                    ${log.error_message ? `
                    <div class="data-row">
                        <span class="data-label">错误信息</span>
                        <span class="data-value" style="color: #f44336;">${log.error_message}</span>
                    </div>
                    ` : ''}
                </div>
            `).join('');
        }
        
        function renderJson() {
            if (!currentResult) {
                return '<p>暂无数据</p>';
            }
            
            const json = JSON.stringify(currentResult, null, 2);
            return `<div class="json-viewer">${json}</div>`;
        }
        
        function clearForm() {
            document.getElementById('customerId').value = '';
            document.getElementById('productCategory').value = '';
            document.getElementById('query').value = '';
            document.getElementById('resultSection').classList.add('hidden');
            currentResult = null;
        }
        
        async function initDatabase() {
            try {
                const response = await fetch('/api/init', {
                    method: 'POST'
                });
                
                const result = await response.json();
                alert(result.message || '初始化完成');
                
            } catch (error) {
                alert('初始化失败: ' + error.message);
            }
        }
        
        function useExample(num) {
            const examples = {
                1: {
                    query: '采购50台工业风机，想要30天账期，对比往期大客户成交价，给一套合作方案',
                    category: '工业风机'
                },
                2: {
                    query: '采购100台电机，预算控制在12万以内，需要快速交货',
                    category: '电机'
                },
                3: {
                    query: '采购20台离心泵，用于化工流程改造，需要技术方案和报价',
                    category: '离心泵'
                }
            };
            
            const example = examples[num];
            document.getElementById('query').value = example.query;
            document.getElementById('productCategory').value = example.category;
        }
        
        // ==================== 数据库查询功能 ====================
        
        async function executeDbQuery() {
            const queryText = document.getElementById('dbQuery').value.trim();
            
            if (!queryText) {
                alert('请输入查询内容');
                return;
            }
            
            const resultDiv = document.getElementById('dbQueryResult');
            resultDiv.innerHTML = '<div class="db-loading">正在查询...</div>';
            
            try {
                const response = await fetch('/api/db/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query_text: queryText,
                        query_type: null
                    })
                });
                
                const result = await response.json();
                renderDbQueryResult(result);
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="db-empty" style="color: #f44336;">查询失败: ${error.message}</div>`;
            }
        }
        
        async function loadProductList() {
            const resultDiv = document.getElementById('dbQueryResult');
            resultDiv.innerHTML = '<div class="db-loading">正在加载产品列表...</div>';
            
            try {
                const response = await fetch('/api/db/products');
                const products = await response.json();
                
                if (!products || products.length === 0) {
                    resultDiv.innerHTML = '<div class="db-empty">暂无产品数据，请先初始化数据库</div>';
                    return;
                }
                
                let html = `
                    <h4 style="margin: 15px 0 10px;">产品列表（共 ${products.length} 个产品）</h4>
                    <table class="db-result-table">
                        <thead>
                            <tr>
                                <th>产品SKU</th>
                                <th>产品名称</th>
                                <th>分类</th>
                                <th>单价</th>
                                <th>单位</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                products.forEach(p => {
                    html += `
                        <tr>
                            <td>${p.product_sku}</td>
                            <td>${p.product_name}</td>
                            <td>${p.category}</td>
                            <td>${p.base_price.toFixed(2)} CNY</td>
                            <td>${p.unit}</td>
                        </tr>
                    `;
                });
                
                html += '</tbody></table>';
                resultDiv.innerHTML = html;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="db-empty" style="color: #f44336;">加载失败: ${error.message}</div>`;
            }
        }
        
        async function loadInventoryOverview() {
            const resultDiv = document.getElementById('dbQueryResult');
            resultDiv.innerHTML = '<div class="db-loading">正在加载库存概览...</div>';
            
            try {
                const response = await fetch('/api/db/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query_text: '所有产品库存',
                        query_type: 'inventory'
                    })
                });
                
                const result = await response.json();
                
                if (result.status !== 'success' || !result.data || result.data.length === 0) {
                    resultDiv.innerHTML = '<div class="db-empty">暂无库存数据</div>';
                    return;
                }
                
                let html = `<h4 style="margin: 15px 0 10px;">库存概览（共 ${result.data.length} 个产品）</h4>`;
                html += '<div class="db-inventory-card">';
                
                result.data.forEach(item => {
                    html += `
                        <div class="db-inventory-item">
                            <h4>${item.product_name}</h4>
                            <div class="data-row">
                                <span class="data-label">SKU</span>
                                <span class="data-value">${item.product_sku}</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">总库存</span>
                                <span class="data-value">${item.stock_quantity} ${item.unit}</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">可用库存</span>
                                <span class="data-value" style="color: #4caf50;">${item.available_quantity} ${item.unit}</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">备货周期</span>
                                <span class="data-value">${item.lead_time}</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">仓库</span>
                                <span class="data-value">${item.warehouse_location}</span>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                resultDiv.innerHTML = html;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="db-empty" style="color: #f44336;">加载失败: ${error.message}</div>`;
            }
        }
        
        function quickQuery(text) {
            document.getElementById('dbQuery').value = text;
            executeDbQuery();
        }
        
        function clearDbQuery() {
            document.getElementById('dbQuery').value = '';
            document.getElementById('dbQueryResult').innerHTML = '';
        }
        
        function renderDbQueryResult(result) {
            const resultDiv = document.getElementById('dbQueryResult');
            
            if (result.status !== 'success') {
                resultDiv.innerHTML = `<div class="db-empty" style="color: #f44336;">查询失败: ${result.detail || result.message}</div>`;
                return;
            }
            
            const { query_type, data, count, message } = result;
            
            if (count === 0) {
                resultDiv.innerHTML = `<div class="db-empty">未找到相关数据</div>`;
                return;
            }
            
            let html = `<p style="margin: 10px 0; color: #666;">查询类型: ${query_type}，找到 ${count} 条记录</p>`;
            
            if (message) {
                html += `<p style="margin: 5px 0 10px; color: #999; font-size: 12px;">${message}</p>`;
            }
            
            // 根据查询类型渲染不同格式
            if (query_type === 'inventory') {
                html += '<div class="db-inventory-card">';
                data.forEach(item => {
                    html += `
                        <div class="db-inventory-item">
                            <h4>${item.product_name}</h4>
                            <div class="data-row">
                                <span class="data-label">SKU</span>
                                <span class="data-value">${item.product_sku}</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">总库存</span>
                                <span class="data-value">${item.stock_quantity} ${item.unit}</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">可用库存</span>
                                <span class="data-value" style="color: #4caf50;">${item.available_quantity} ${item.unit}</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">已预订</span>
                                <span class="data-value">${item.reserved_quantity} ${item.unit}</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">备货周期</span>
                                <span class="data-value">${item.lead_time}</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">仓库</span>
                                <span class="data-value">${item.warehouse_location}</span>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            } else if (query_type === 'product' || query_type === 'price') {
                html += `
                    <table class="db-result-table">
                        <thead>
                            <tr>
                                <th>产品SKU</th>
                                <th>产品名称</th>
                                <th>分类</th>
                                <th>单价</th>
                                <th>单位</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                data.forEach(p => {
                    html += `
                        <tr>
                            <td>${p.product_sku}</td>
                            <td>${p.product_name}</td>
                            <td>${p.category || '-'}</td>
                            <td>${p.base_price ? p.base_price.toFixed(2) : '-'} CNY</td>
                            <td>${p.unit || '-'}</td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
            } else if (query_type === 'customer') {
                html += `
                    <table class="db-result-table">
                        <thead>
                            <tr>
                                <th>客户ID</th>
                                <th>客户名称</th>
                                <th>行业</th>
                                <th>联系人</th>
                                <th>电话</th>
                                <th>信用等级</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                data.forEach(c => {
                    html += `
                        <tr>
                            <td>${c.customer_id}</td>
                            <td>${c.customer_name}</td>
                            <td>${c.industry || '-'}</td>
                            <td>${c.contact_person || '-'}</td>
                            <td>${c.contact_phone || '-'}</td>
                            <td>${c.credit_level || '-'}</td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
            } else if (query_type === 'deal') {
                html += `
                    <table class="db-result-table">
                        <thead>
                            <tr>
                                <th>订单号</th>
                                <th>产品</th>
                                <th>客户</th>
                                <th>数量</th>
                                <th>单价</th>
                                <th>总价</th>
                                <th>折扣</th>
                                <th>成交日期</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                data.forEach(d => {
                    html += `
                        <tr>
                            <td>${d.deal_id}</td>
                            <td>${d.product_name}</td>
                            <td>${d.customer_name || '-'}</td>
                            <td>${d.quantity}</td>
                            <td>${d.unit_price ? d.unit_price.toFixed(2) : '-'}</td>
                            <td>${d.total_amount ? d.total_amount.toFixed(2) : '-'}</td>
                            <td>${d.discount_rate ? (d.discount_rate * 100).toFixed(1) + '%' : '-'}</td>
                            <td>${d.deal_date || '-'}</td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
            } else {
                // 默认表格展示
                html += `<div class="json-viewer">${JSON.stringify(data, null, 2)}</div>`;
            }
            
            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
